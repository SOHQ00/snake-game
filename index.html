<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
#game{text-align:center}
canvas{
    background:#222;
    border:3px solid #555;
    display:block;
    margin:10px auto;
}
button{
    padding:10px 20px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    background:#28a745;
    color:#fff;
    font-size:16px;
}
</style>
</head>
<body>

<div id="game">
<h1>🐍 Snake</h1>
<p>Pontos: <span id="score">0</span></p>
<canvas id="c" width="400" height="400"></canvas>
<button onclick="start()">Jogar Novamente</button>
</div>

<script>
const cvs=document.getElementById("c");
const ctx=cvs.getContext("2d");
const box=20;
const size=20;

let snake,food,dir,score,loop;

function randomFood(){
    while(true){
        let x=Math.floor(Math.random()*size);
        let y=Math.floor(Math.random()*size);
        let ok=true;
        for(let s of snake)
            if(s.x==x&&s.y==y) ok=false;
        if(ok) return {x,y};
    }
}

function start(){
    clearInterval(loop);
    snake=[{x:10,y:10}];
    dir="RIGHT";
    score=0;
    document.getElementById("score").textContent=0;
    food=randomFood();
    loop=setInterval(draw,120);
}

document.addEventListener("keydown",e=>{
    if(e.key=="ArrowUp"&&dir!="DOWN")dir="UP";
    if(e.key=="ArrowDown"&&dir!="UP")dir="DOWN";
    if(e.key=="ArrowLeft"&&dir!="RIGHT")dir="LEFT";
    if(e.key=="ArrowRight"&&dir!="LEFT")dir="RIGHT";
});

function draw(){

    ctx.fillStyle="#222";
    ctx.fillRect(0,0,400,400);

    ctx.fillStyle="red";
    ctx.fillRect(food.x*box+2,food.y*box+2,box-4,box-4);

    let head={...snake[0]};

    if(dir=="UP")head.y--;
    if(dir=="DOWN")head.y++;
    if(dir=="LEFT")head.x--;
    if(dir=="RIGHT")head.x++;

    if(
        head.x<0||
        head.y<0||
        head.x>=size||
        head.y>=size||
        snake.some(s=>s.x==head.x&&s.y==head.y)
    ){
        clearInterval(loop);
        alert("Game Over!\nPontuação: "+score);
        return;
    }

    snake.unshift(head);

    if(head.x==food.x&&head.y==food.y){
        score++;
        document.getElementById("score").textContent=score;
        food=randomFood();
    }else{
        snake.pop();
    }

    ctx.fillStyle="lime";
    for(let s of snake){
        ctx.fillRect(s.x*box+1,s.y*box+1,box-2,box-2);
    }
}

start();
</script>

</body>
</html>
